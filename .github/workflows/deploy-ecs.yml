name: Deploy to ECS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      aws_account_id:
        description: >-
          Override target AWS account ID (12 digits). Defaults to repository
          variable AWS_ACCOUNT_ID when empty.
        required: false
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
  AWS_ACCOUNT_ID: ${{ github.event.inputs.aws_account_id || vars.AWS_ACCOUNT_ID }}
  AWS_DEPLOY_ROLE_NAME: ${{ vars.AWS_DEPLOY_ROLE_NAME || 'github-ecs-deploy' }}
  ECR_REPOSITORY: costsense
  ECS_CLUSTER: costsense-cluster
  ECS_SERVICE: costsense-service
  ECS_TASK_DEFINITION: costsense
  CONTAINER_NAME: costsense
  CONTAINER_PORT: "8501"
  TASK_EXECUTION_ROLE_NAME: ${{ vars.TASK_EXECUTION_ROLE_NAME || 'costsense-ecs-execution-role' }}
  TASK_ROLE_NAME: ${{ vars.TASK_ROLE_NAME || 'costsense-task-role' }}
  # Only needed the first time the service is created. Once it exists, later
  # deploys just update it and these are ignored.
  ECS_SUBNET_IDS: ${{ vars.ECS_SUBNET_IDS }}
  ECS_SECURITY_GROUP_IDS: ${{ vars.ECS_SECURITY_GROUP_IDS }}
  ECS_TARGET_GROUP_ARN: ${{ vars.ECS_TARGET_GROUP_ARN }}
  ECS_ASSIGN_PUBLIC_IP: ${{ vars.ECS_ASSIGN_PUBLIC_IP || 'ENABLED' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Resolve deploy role ARN
        id: role
        env:
          DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_TO_ASSUME }}
        run: |
          if [ -n "$DEPLOY_ROLE_ARN" ]; then
            echo "arn=$DEPLOY_ROLE_ARN" >> "$GITHUB_OUTPUT"
            echo "Using AWS_DEPLOY_ROLE_TO_ASSUME secret"
          elif [ -n "$AWS_ACCOUNT_ID" ]; then
            echo "arn=arn:aws:iam::${AWS_ACCOUNT_ID}:role/${AWS_DEPLOY_ROLE_NAME}" >> "$GITHUB_OUTPUT"
            echo "Using role arn:aws:iam::${AWS_ACCOUNT_ID}:role/${AWS_DEPLOY_ROLE_NAME}"
          else
            echo "Set repository variable AWS_ACCOUNT_ID or secret AWS_DEPLOY_ROLE_TO_ASSUME"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify target AWS account
        run: |
          ACTUAL=$(aws sts get-caller-identity --query Account --output text)
          echo "Authenticated to AWS account ${ACTUAL}"
          if [ -n "$AWS_ACCOUNT_ID" ] && [ "$ACTUAL" != "$AWS_ACCOUNT_ID" ]; then
            echo "Expected AWS_ACCOUNT_ID=$AWS_ACCOUNT_ID but assumed role resolved to $ACTUAL"
            exit 1
          fi
          echo "AWS_ACCOUNT_ID=$ACTUAL" >> "$GITHUB_ENV"

      - name: Ensure ECS cluster exists
        run: |
          STATUS=$(aws ecs describe-clusters --clusters "$ECS_CLUSTER" \
            --query 'clusters[0].status' --output text 2>/dev/null || echo "MISSING")
          if [ "$STATUS" = "ACTIVE" ]; then
            echo "ECS cluster $ECS_CLUSTER already exists"
          else
            echo "Creating ECS cluster $ECS_CLUSTER"
            aws ecs create-cluster --cluster-name "$ECS_CLUSTER" >/dev/null
          fi

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          if ! aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1; then
            echo "Creating ECR repository $ECR_REPOSITORY"
            aws ecr create-repository \
              --repository-name "$ECR_REPOSITORY" \
              --image-scanning-configuration scanOnPush=true
          else
            echo "ECR repository $ECR_REPOSITORY already exists"
          fi

      - name: Prepare runtime config
        env:
          COSTSENSE_GITHUB_TOKEN: ${{ secrets.COSTSENSE_GITHUB_TOKEN }}
        run: python scripts/prepare_deploy_config.py

      - name: Build, tag, and push image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Ensure ECS task definition exists
        env:
          IMAGE: ${{ steps.build-image.outputs.image }}
        run: |
          if aws ecs describe-task-definition --task-definition "$ECS_TASK_DEFINITION" >/dev/null 2>&1; then
            echo "Task definition family $ECS_TASK_DEFINITION already exists"
          else
            echo "Registering initial task definition for $ECS_TASK_DEFINITION"
            jq \
              --arg image "$IMAGE" \
              --arg execRole "arn:aws:iam::${AWS_ACCOUNT_ID}:role/${TASK_EXECUTION_ROLE_NAME}" \
              --arg taskRole "arn:aws:iam::${AWS_ACCOUNT_ID}:role/${TASK_ROLE_NAME}" \
              --arg region "$AWS_REGION" \
              '.containerDefinitions[0].image = $image
               | .executionRoleArn = $execRole
               | .taskRoleArn = $taskRole
               | .containerDefinitions[0].logConfiguration.options["awslogs-region"] = $region' \
              deploy/ecs/task-definition.json > initial-task-definition.json
            aws ecs register-task-definition --cli-input-json file://initial-task-definition.json >/dev/null
          fi

      - name: Ensure ECS service exists
        run: |
          STATUS=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].status' --output text 2>/dev/null || echo "MISSING")
          if [ "$STATUS" = "ACTIVE" ]; then
            echo "ECS service $ECS_SERVICE already exists"
            exit 0
          fi

          if [ -z "$ECS_SUBNET_IDS" ] || [ -z "$ECS_SECURITY_GROUP_IDS" ]; then
            echo "ECS service $ECS_SERVICE does not exist yet."
            echo "Set repository variables ECS_SUBNET_IDS and ECS_SECURITY_GROUP_IDS"
            echo "(comma-separated) so the pipeline can create it, or run"
            echo "./deploy/cloudformation/deploy.sh once to create the full stack."
            exit 1
          fi

          NETWORK_CONFIG=$(jq -n \
            --arg subnets "$ECS_SUBNET_IDS" \
            --arg sgs "$ECS_SECURITY_GROUP_IDS" \
            --arg pubip "$ECS_ASSIGN_PUBLIC_IP" \
            '{awsvpcConfiguration: {subnets: ($subnets | split(",")), securityGroups: ($sgs | split(",")), assignPublicIp: $pubip}}')

          # Circuit breaker makes a bad rollout fail fast (~a few minutes)
          # instead of the service flapping/retrying for the full job timeout.
          CREATE_ARGS=(--cluster "$ECS_CLUSTER" --service-name "$ECS_SERVICE"
            --task-definition "$ECS_TASK_DEFINITION" --desired-count 1
            --launch-type FARGATE --network-configuration "$NETWORK_CONFIG"
            --deployment-configuration "deploymentCircuitBreaker={enable=true,rollback=true},maximumPercent=200,minimumHealthyPercent=100")

          if [ -n "$ECS_TARGET_GROUP_ARN" ]; then
            LB_CONFIG=$(jq -n \
              --arg tg "$ECS_TARGET_GROUP_ARN" \
              --arg name "$CONTAINER_NAME" \
              --argjson port "$CONTAINER_PORT" \
              '[{targetGroupArn: $tg, containerName: $name, containerPort: $port}]')
            CREATE_ARGS+=(--load-balancers "$LB_CONFIG" --health-check-grace-period-seconds 120)
          else
            echo "ECS_TARGET_GROUP_ARN not set — creating service without a load balancer."
          fi

          echo "Creating ECS service $ECS_SERVICE"
          aws ecs create-service "${CREATE_ARGS[@]}" >/dev/null

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition > task-definition.json

      - name: Render new task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to ECS
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 10

      - name: Show ECS diagnostics on failure
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          echo "### Deploy failed — recent service events" | tee -a "$GITHUB_STEP_SUMMARY"
          aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].events[0:10].[createdAt,message]' --output text \
            | tee -a "$GITHUB_STEP_SUMMARY"

          echo "### Recently stopped tasks" | tee -a "$GITHUB_STEP_SUMMARY"
          STOPPED=$(aws ecs list-tasks --cluster "$ECS_CLUSTER" --service-name "$ECS_SERVICE" \
            --desired-status STOPPED --query 'taskArns' --output text)
          if [ -n "$STOPPED" ]; then
            aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks $STOPPED \
              --query 'tasks[*].{stoppedReason:stoppedReason,containers:containers[*].{reason:reason,exitCode:exitCode}}' \
              --output json | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No stopped tasks found." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          echo "Check CloudWatch Logs: /ecs/costsense" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Deployment summary
        run: |
          {
            echo "### CostSense ECS deploy"
            echo "- **Account:** $(aws sts get-caller-identity --query Account --output text)"
            echo "- **Region:** $AWS_REGION"
            echo "- **Image:** ${{ steps.build-image.outputs.image }}"
            echo "- **Cluster:** $ECS_CLUSTER"
            echo "- **Service:** $ECS_SERVICE"
          } >> "$GITHUB_STEP_SUMMARY"
