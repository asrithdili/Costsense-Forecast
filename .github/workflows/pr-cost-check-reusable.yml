name: PR Cost Check (reusable)

on:
  workflow_call:
    inputs:
      aws_profile:
        description: AWS profile name for Cost Explorer / CloudWatch / Bedrock
        required: true
        type: string
      aws_region:
        description: AWS region for OIDC credentials
        default: us-west-2
        type: string
      model_id:
        description: Bedrock model ID for PR analysis
        default: us.anthropic.claude-sonnet-4-6
        type: string
      max_daily_increase_usd:
        description: Fail when estimated daily increase exceeds this USD amount
        default: "5"
        type: string
      min_tool_calls:
        description: Minimum AWS tool calls required for a valid verdict
        default: "5"
        type: string
      history_days:
        description: Days of Cost Explorer history for the forecast chart
        default: "60"
        type: string
      include_forecast_chart:
        description: Render forecast.png and embed it in the job summary
        default: true
        type: boolean
      costsense_repository:
        description: >-
          Repo containing CostSense code (org/name). Leave empty when the
          reusable workflow runs inside this repository.
        required: false
        type: string
    secrets:
      AWS_ROLE_TO_ASSUME:
        description: IAM role ARN for OIDC (Bedrock + read-only AWS APIs)
        required: true

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  pr-cost-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout CostSense
        uses: actions/checkout@v4
        with:
          repository: >-
            ${{ inputs.costsense_repository != '' && inputs.costsense_repository || github.repository }}
          path: costsense

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: costsense
        run: pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ inputs.aws_region }}

      - name: Run PR cost check
        id: check
        working-directory: costsense
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Logical account label for CostSense — not ~/.aws/config on GHA.
          COSTSENSE_AWS_PROFILE: ${{ inputs.aws_profile }}
        run: |
          ARGS=(
            --pr-url "${{ github.event.pull_request.html_url }}"
            --profile "${{ inputs.aws_profile }}"
            --model-id "${{ inputs.model_id }}"
            --max-daily-increase-usd "${{ inputs.max_daily_increase_usd }}"
            --min-tool-calls "${{ inputs.min_tool_calls }}"
            --history-days "${{ inputs.history_days }}"
            --output-json pr-cost-verdict.json
          )
          if [ "${{ inputs.include_forecast_chart }}" = "true" ]; then
            ARGS+=(--forecast-chart forecast.png)
          fi
          python scripts/pr_cost_check.py "${ARGS[@]}"

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-cost-report
          path: |
            costsense/pr-cost-verdict.json
            costsense/forecast.png
          if-no-files-found: ignore
