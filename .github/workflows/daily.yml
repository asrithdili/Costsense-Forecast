name: daily-forecast

on:
  schedule:
    - cron: "15 6 * * *"   # 06:15 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

jobs:
  forecast-and-backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      # Debug: print the OIDC token's key claims BEFORE we try to assume the
      # role. Lets us compare what GitHub actually sends against the trust
      # policy's StringLike condition on `sub`. Safe to leave in on a debug
      # branch — the token is short-lived and only readable by this run.
      - name: Debug — decode OIDC token claims
        run: |
          set -euo pipefail
          RAW=$(curl -sSL \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          TOKEN=$(echo "$RAW" | jq -r .value)
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          # Pad base64url so `base64 -d` accepts it.
          PADDED=$(printf '%s%s' "$PAYLOAD" "$(printf '=%.0s' $(seq 1 $(( (4 - ${#PAYLOAD} % 4) % 4 ))))")
          CLAIMS=$(printf '%s' "$PADDED" | tr '_-' '/+' | base64 -d 2>/dev/null || true)
          echo "==== OIDC token claims (compare against trust policy) ===="
          echo "$CLAIMS" | jq '{sub, aud, iss, repository, ref, environment, workflow, job_workflow_ref}'
          echo "=========================================================="
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Run daily pipeline
        run: python -m src.pipeline.run_daily

      - name: Backtest yesterday's forecast target
        run: python -m src.backtest.scorer

      - name: Commit predictions + backtest
        run: |
          git config user.name  "costsense-bot"
          git config user.email "costsense-bot@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "daily forecast + backtest $(date -u +%Y-%m-%d)"
            git push
          fi
