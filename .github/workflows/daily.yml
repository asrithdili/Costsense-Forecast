name: daily-forecast

on:
  schedule:
    - cron: "15 6 * * *"   # 06:15 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

jobs:
  forecast-and-backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Run daily pipeline
        run: python -m src.pipeline.run_daily

      - name: Backtest yesterday's forecast target
        run: python -m src.backtest.scorer

      - name: Commit predictions + backtest
        run: |
          git config user.name  "costsense-bot"
          git config user.email "costsense-bot@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "daily forecast + backtest $(date -u +%Y-%m-%d)"
            git push
          fi
